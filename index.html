<!-- BACKGROUND MUSIC -->
<script>
    window.addEventListener("load", () => {

        const AUDIO_URL =
            "https://files.catbox.moe/yrsaxu.mp3";

        const audio =
            document.createElement("audio");

        audio.id = "bgmusic";
        audio.src = AUDIO_URL;
        audio.loop = true;
        audio.volume = 0.5;
        audio.preload = "auto";

        document.body.appendChild(audio);

        const overlay =
            document.createElement("div");

        overlay.id = "soundOverlay";

        overlay.innerHTML = `
            <div id="soundPrompt">
                <h1>CLICK FOR SOUND</h1>
                <p>Tap anywhere on mobile</p>
            </div>
        `;

        document.body.appendChild(overlay);

        const style =
            document.createElement("style");

        style.textContent = `

            #soundOverlay {
                position: fixed;
                inset: 0;
                z-index: 999999;
                display: flex;
                align-items: center;
                justify-content: center;
                background: #000;
                color: #fff;
                cursor: pointer;
                user-select: none;
                -webkit-user-select: none;
                touch-action: manipulation;
                transition:
                    opacity .4s ease,
                    visibility .4s ease;
            }

            #soundOverlay.hidden {
                opacity: 0;
                visibility: hidden;
                pointer-events: none;
            }

            #soundPrompt {
                text-align: center;
                padding: 30px;
            }

            #soundPrompt h1 {
                margin: 0;
                font-family: Arial, sans-serif;
                font-size: clamp(28px, 6vw, 64px);
                font-weight: 800;
                letter-spacing: 2px;
            }

            #soundPrompt p {
                margin-top: 15px;
                font-family: Arial, sans-serif;
                font-size: 18px;
                opacity: .6;
            }

        `;

        document.head.appendChild(style);

        let started = false;

        function startSound() {

            if (started) return;

            audio.volume = 0.5;

            audio.play()
                .then(() => {

                    started = true;

                    overlay.classList.add("hidden");

                    setTimeout(() => {
                        overlay.remove();
                    }, 400);

                    console.log("playing!");

                })
                .catch(error => {

                    console.error(
                        "Audio could not play:",
                        error
                    );

                });

        }

        document.addEventListener(
            "keydown",
            startSound
        );

        overlay.addEventListener(
            "pointerdown",
            startSound
        );

    });
</script>
