<script>
document.addEventListener("DOMContentLoaded", function () {

    /* =========================================
       EMAILJS CONFIG
    ========================================= */

    const EMAILJS_PUBLIC_KEY = "niJY28BM-OFMrbhGl";
    const EMAILJS_SERVICE_ID = "service_8g7erzy";
    const EMAILJS_TEMPLATE_ID = "template_pslge5b";


    /* =========================================
       ALLOWED EMAILS
    ========================================= */

    const ALLOWED_EMAILS = [
        "hudson.stokes2@student.education.wa.edu.au",
        "Mahasuryateja.majji@student.education.wa.edu.au"
    ];


    /* =========================================
       ELEMENTS
    ========================================= */

    const passwordScreen =
        document.getElementById("passwordScreen");

    const passwordBox =
        document.getElementById("passwordBox");

    const emailSection =
        document.getElementById("emailSection");

    const codeSection =
        document.getElementById("codeSection");

    const emailInput =
        document.getElementById("emailInput");

    const passwordButton =
        document.getElementById("passwordButton");

    const passwordError =
        document.getElementById("passwordError");

    const codeDescription =
        document.getElementById("codeDescription");

    const codeStatus =
        document.getElementById("codeStatus");

    const resendButton =
        document.getElementById("resendButton");

    const backButton =
        document.getElementById("backButton");

    const codeInputs =
        Array.from(
            document.querySelectorAll(".codeInput")
        );


    /* =========================================
       LOGIN REMEMBER TIME
       
       24 hours
    ========================================= */

    const LOGIN_DURATION =
        24 * 60 * 60 * 1000;


    /* =========================================
       CHECK SAVED LOGIN
    ========================================= */

    function isLoginValid() {

        const savedTime =
            localStorage.getItem(
                "midnightVerified"
            );


        if (!savedTime) {
            return false;
        }


        const elapsed =
            Date.now() - Number(savedTime);


        /* EXPIRED */

        if (elapsed >= LOGIN_DURATION) {

            localStorage.removeItem(
                "midnightVerified"
            );

            return false;
        }


        return true;
    }


    /* =========================================
       SKIP LOGIN IF STILL VALID
    ========================================= */

    if (isLoginValid()) {

        passwordScreen.remove();

        return;
    }


    /* =========================================
       INITIALIZE EMAILJS
    ========================================= */

    emailjs.init({
        publicKey: EMAILJS_PUBLIC_KEY
    });


    /* =========================================
       VARIABLES
    ========================================= */

    let currentCode = "";
    let currentEmail = "";
    let codeExpiresAt = 0;
    let resendCooldown = false;


    /* =========================================
       FOCUS EMAIL
    ========================================= */

    if (emailInput) {
        emailInput.focus();
    }


    /* =========================================
       ERROR
    ========================================= */

    function showError(message) {

        passwordError.textContent = message;

        passwordError.classList.add("show");


        passwordBox.classList.remove("shake");

        void passwordBox.offsetWidth;

        passwordBox.classList.add("shake");
    }


    function clearError() {

        passwordError.textContent = "";

        passwordError.classList.remove("show");
    }


    /* =========================================
       GENERATE 6 DIGIT CODE
    ========================================= */

    function generateCode() {

        return Math.floor(
            100000 +
            Math.random() * 900000
        ).toString();
    }


    /* =========================================
       SEND CODE
    ========================================= */

    async function sendCode() {

        clearError();


        const email =
            emailInput.value
                .trim()
                .toLowerCase();


        /* CHECK EMAIL */

        const allowed =
            ALLOWED_EMAILS.some(
                allowedEmail =>
                    allowedEmail.toLowerCase() === email
            );


        if (!allowed) {

            showError(
                "That email is not allowed."
            );

            emailInput.focus();

            return;
        }


        passwordButton.disabled = true;

        passwordButton.textContent =
            "Sending...";


        currentEmail = email;

        currentCode =
            generateCode();


        /* CODE EXPIRES AFTER 10 MINUTES */

        codeExpiresAt =
            Date.now() +
            (10 * 60 * 1000);


        try {

            await emailjs.send(
                EMAILJS_SERVICE_ID,
                EMAILJS_TEMPLATE_ID,
                {
                    to_email: currentEmail,
                    code: currentCode
                }
            );


            /* SWITCH TO CODE SCREEN */

            emailSection.classList.add("hide");

            codeSection.classList.add("show");


            codeDescription.textContent =
                "We sent a 6 digit code to " +
                currentEmail;


            codeInputs.forEach(
                function (input) {

                    input.value = "";

                    input.classList.remove(
                        "error"
                    );
                }
            );


            codeInputs[0].focus();


            startExpiryTimer();


        } catch (error) {

            console.error(
                "EmailJS error:",
                error
            );


            showError(
                "Couldn't send the code. Try again."
            );


            currentCode = "";
        }


        passwordButton.disabled = false;

        passwordButton.textContent =
            "Send Code";
    }


    /* =========================================
       CODE EXPIRY TIMER
    ========================================= */

    function startExpiryTimer() {

        function updateTimer() {

            const remaining =
                codeExpiresAt -
                Date.now();


            if (remaining <= 0) {

                codeStatus.textContent =
                    "Code expired. Send a new one.";

                currentCode = "";

                return;
            }


            const totalSeconds =
                Math.ceil(
                    remaining / 1000
                );


            const minutes =
                Math.floor(
                    totalSeconds / 60
                );


            const seconds =
                totalSeconds % 60;


            codeStatus.textContent =
                "Code expires in " +
                minutes +
                ":" +
                seconds
                    .toString()
                    .padStart(2, "0");


            setTimeout(
                updateTimer,
                1000
            );
        }


        updateTimer();
    }


    /* =========================================
       UNLOCK SITE
       
       REMEMBER FOR 24 HOURS
    ========================================= */

    function unlockSite() {

        clearError();


        /*
            Save the exact time the user
            successfully logged in.
        */

        localStorage.setItem(
            "midnightVerified",
            Date.now().toString()
        );


        /* FADE LOGIN OUT */

        passwordScreen.classList.add(
            "hidden"
        );


        setTimeout(
            function () {

                passwordScreen.remove();

            },
            500
        );
    }


    /* =========================================
       VERIFY CODE
    ========================================= */

    function verifyCode() {

        const enteredCode =
            codeInputs
                .map(
                    input => input.value
                )
                .join("");


        if (enteredCode.length !== 6) {
            return;
        }


        /* EXPIRED */

        if (
            Date.now() > codeExpiresAt ||
            !currentCode
        ) {

            codeInputs.forEach(
                input =>
                    input.classList.add(
                        "error"
                    )
            );


            codeStatus.textContent =
                "This code has expired.";

            return;
        }


        /* CORRECT */

        if (
            enteredCode === currentCode
        ) {

            unlockSite();

            return;
        }


        /* WRONG */

        codeInputs.forEach(
            input =>
                input.classList.add(
                    "error"
                )
        );


        codeStatus.textContent =
            "Incorrect code.";


        passwordBox.classList.remove(
            "shake"
        );


        void passwordBox.offsetWidth;


        passwordBox.classList.add(
            "shake"
        );


        setTimeout(
            function () {

                codeInputs.forEach(
                    input => {

                        input.value = "";

                        input.classList.remove(
                            "error"
                        );
                    }
                );


                codeInputs[0].focus();

            },
            300
        );
    }


    /* =========================================
       CODE INPUTS
    ========================================= */

    codeInputs.forEach(
        function (input, index) {

            /* INPUT */

            input.addEventListener(
                "input",
                function () {

                    input.classList.remove(
                        "error"
                    );


                    input.value =
                        input.value.replace(
                            /[^0-9]/g,
                            ""
                        );


                    /* NEXT BOX */

                    if (
                        input.value &&
                        index <
                        codeInputs.length - 1
                    ) {

                        codeInputs[
                            index + 1
                        ].focus();
                    }


                    /* AUTO VERIFY */

                    if (
                        codeInputs.every(
                            box =>
                                box.value.length === 1
                        )
                    ) {

                        verifyCode();
                    }
                }
            );


            /* KEYBOARD CONTROLS */

            input.addEventListener(
                "keydown",
                function (event) {

                    /* BACKSPACE */

                    if (
                        event.key === "Backspace" &&
                        !input.value &&
                        index > 0
                    ) {

                        codeInputs[
                            index - 1
                        ].focus();
                    }


                    /* LEFT ARROW */

                    if (
                        event.key === "ArrowLeft" &&
                        index > 0
                    ) {

                        codeInputs[
                            index - 1
                        ].focus();
                    }


                    /* RIGHT ARROW */

                    if (
                        event.key === "ArrowRight" &&
                        index <
                        codeInputs.length - 1
                    ) {

                        codeInputs[
                            index + 1
                        ].focus();
                    }
                }
            );


            /* =================================
               PASTE FULL 6 DIGIT CODE
            ================================= */

            input.addEventListener(
                "paste",
                function (event) {

                    event.preventDefault();


                    const pasted =
                        (
                            event.clipboardData ||
                            window.clipboardData
                        )
                            .getData("text")
                            .replace(
                                /[^0-9]/g,
                                ""
                            )
                            .slice(0, 6);


                    if (!pasted) {
                        return;
                    }


                    pasted
                        .split("")
                        .forEach(
                            function (
                                character,
                                i
                            ) {

                                if (
                                    codeInputs[i]
                                ) {

                                    codeInputs[i]
                                        .value =
                                        character;
                                }
                            }
                        );


                    const nextIndex =
                        Math.min(
                            pasted.length,
                            5
                        );


                    codeInputs[
                        nextIndex
                    ].focus();


                    /* VERIFY IF 6 DIGITS */

                    if (
                        pasted.length === 6
                    ) {

                        verifyCode();
                    }
                }
            );
        }
    );


    /* =========================================
       SEND CODE BUTTON
    ========================================= */

    passwordButton.addEventListener(
        "click",
        sendCode
    );


    /* =========================================
       ENTER TO SEND CODE
    ========================================= */

    emailInput.addEventListener(
        "keydown",
        function (event) {

            if (
                event.key === "Enter"
            ) {

                sendCode();
            }
        }
    );


    /* =========================================
       RESEND CODE
    ========================================= */

    resendButton.addEventListener(
        "click",
        async function () {

            if (resendCooldown) {
                return;
            }


            resendCooldown = true;

            resendButton.disabled = true;

            resendButton.textContent =
                "Sending...";


            currentCode =
                generateCode();


            codeExpiresAt =
                Date.now() +
                (10 * 60 * 1000);


            try {

                await emailjs.send(
                    EMAILJS_SERVICE_ID,
                    EMAILJS_TEMPLATE_ID,
                    {
                        to_email: currentEmail,
                        code: currentCode
                    }
                );


                codeInputs.forEach(
                    input => {

                        input.value = "";

                        input.classList.remove(
                            "error"
                        );
                    }
                );


                codeStatus.textContent =
                    "New code sent. Code expires in 10 minutes.";


                codeInputs[0].focus();


            } catch (error) {

                console.error(
                    "EmailJS error:",
                    error
                );


                codeStatus.textContent =
                    "Couldn't send a new code.";
            }


            resendButton.textContent =
                "Resend Code";


            /* 5 SECOND COOLDOWN */

            setTimeout(
                function () {

                    resendCooldown = false;

                    resendButton.disabled =
                        false;

                },
                5000
            );
        }
    );


    /* =========================================
       BACK / CHANGE EMAIL
    ========================================= */

    backButton.addEventListener(
        "click",
        function () {

            currentCode = "";

            currentEmail = "";

            codeExpiresAt = 0;


            emailSection.classList.remove(
                "hide"
            );


            codeSection.classList.remove(
                "show"
            );


            codeInputs.forEach(
                input => {

                    input.value = "";

                    input.classList.remove(
                        "error"
                    );
                }
            );


            codeStatus.textContent =
                "Code expires in 10 minutes";


            clearError();


            emailInput.focus();
        }
    );

});
</script>
